name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

# Se chegar uma mudança nova no mesmo branch, cancela a run antiga que ainda está rodando.
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

# Menor permissão possível: só ler o código. Nada de escrever no repositório.
permissions:
  contents: read

# Duas etapas, em ordem: o smoke (testes críticos, marcados com [Smoke]) vem primeiro; o resto só
# roda se TODAS as execuções do smoke passarem. Se o smoke falhar, a regressão aparece como "skipped".
# Os outros testes smoke continuam rodando mesmo que um falhe (o dotnet test não para no primeiro erro).
# Um filtro que não acha nenhum teste termina com código 8 e o job falha (não passa em verde).
jobs:
  smoke:
    name: Smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false          # um navegador falhando não cancela o outro
      matrix:
        browser: [Chromium, Firefox]   # exatamente os nomes do BrowserKind, sem o WebKit pois ele não roda com o ubuntu-latest

    env:
      SAUCEDEMO_Browser: ${{ matrix.browser }}
      SAUCEDEMO_Trace: Off      # o trace não sai da máquina (repositório público)

    steps:
      - uses: actions/checkout@v4

      # O 10 liga o modo novo do 'dotnet test' (global.json); o 8 roda os testes (net8.0).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Compilar
        run: dotnet build

      - name: Instalar o navegador deste job
        run: pwsh PlaywrightFramework/bin/Debug/net8.0/playwright.ps1 install --with-deps "${BROWSER,,}"
        env:
          BROWSER: ${{ matrix.browser }}

      - name: Rodar os testes smoke
        run: >
          dotnet test
          --filter-trait "Category=Smoke"
          --results-directory TestResults
          --report-xunit-html
          --report-xunit-html-filename relatorio-smoke-${{ matrix.browser }}.html

      # 'always()': sobe a evidência mesmo quando os testes falham, que é quando ela importa.
      - name: Guardar relatório e evidência na run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-smoke-${{ matrix.browser }}
          path: |
            TestResults/
            PlaywrightFramework/bin/Debug/net8.0/test-results/
          if-no-files-found: ignore   # run verde não tem pasta de evidência
          retention-days: 7

  regressao:
    name: Regressão (${{ matrix.browser }})
    needs: smoke                # só roda se TODAS as execuções do smoke passarem
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        browser: [Chromium, Firefox]

    env:
      SAUCEDEMO_Browser: ${{ matrix.browser }}
      SAUCEDEMO_Trace: Off

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Compilar
        run: dotnet build

      - name: Instalar o navegador deste job
        run: pwsh PlaywrightFramework/bin/Debug/net8.0/playwright.ps1 install --with-deps "${BROWSER,,}"
        env:
          BROWSER: ${{ matrix.browser }}

      - name: Rodar os testes que não são smoke
        run: >
          dotnet test
          --filter-not-trait "Category=Smoke"
          --results-directory TestResults
          --report-xunit-html
          --report-xunit-html-filename relatorio-regressao-${{ matrix.browser }}.html

      - name: Guardar relatório e evidência na run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-regressao-${{ matrix.browser }}
          path: |
            TestResults/
            PlaywrightFramework/bin/Debug/net8.0/test-results/
          if-no-files-found: ignore
          retention-days: 7
